# Run 2867524 (ablation_dit_dcae_no_bottleneck_resume_4nodes, 16 GPUs); evaluated: outputs/dit/checkpoints/epoch_44_step_58057.ckpt
data:
  root: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  num_workers: 8

model:
  type: dit
  image_size: 512
  depth: 28
  hidden_size: 1152
  mlp_ratio: 2.5
  y_norm_scale_factor: 0.01
  grad_checkpointing: true
  pretrained:
    sana_path: checkpoints/Sana_600M_512px/checkpoints/Sana_600M_512px_MultiLing.pth
    empty_prompt_path: checkpoints/empty_prompt_gemma-2-2b-it.safetensors
    dcae_path: checkpoints/dc-ae-f32c32-sana-1.1

loss:
  normalize_by_gt_count: true
  mark_link: cubic
  weights: {ppp: 1.0, rcs: 1.0, doppler: 1.0}

optim:
  type: CAME
  lr: 1.0e-4
  betas: [0.9, 0.999, 0.9999]
  eps: [1.0e-30, 1.0e-16]
  weight_decay: 0.0

train:
  seed: 42
  batch_size: 4  # per GPU
  warmup_steps: 200
  gradient_clip: 0.1
  precision: bf16-mixed
  max_steps: 58057
  log_every_n_steps: 20
  checkpoint_every_n_steps: 1000
  val_every_n_steps: 2000
  limit_val_batches: 50
