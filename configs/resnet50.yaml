# Run 2882612 (ablation_resnet50_backbone, 16 GPUs); evaluated: outputs/resnet50/checkpoints/epoch_95_step_25030.ckpt
data:
  root: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  num_workers: 8

model:
  type: resnet
  projection_channels: 384
  neck_layers: 12
  neck_heads: 9
  head:
    channels: [128, 64, 32]
    blocks: 2
    heads: 4
    window_size: 8
    output_scale: 2
    projection_kernel_size: 3
    shifted_windows: true
  grad_checkpointing: true
  pretrained:
    checkpoint_path: checkpoints/resnet50/resnet50-11ad3fa6.pth  # torchvision IMAGENET1K_V2

loss:
  normalize_by_gt_count: true
  mark_link: cubic
  weights: {ppp: 1.0, rcs: 1.0, doppler: 1.0}

optim:
  type: AdamW
  lr: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01

train:
  seed: 42
  batch_size: 20  # per GPU
  warmup_steps: 200
  gradient_clip: 1.0
  precision: bf16-mixed
  max_steps: 25030
  log_every_n_steps: 20
  checkpoint_every_n_steps: 1000
  val_every_n_steps: 2000
  limit_val_batches: 50
